name: Build ETN Android APK

on:
  push:
    paths:
      - '.github/workflows/build-android.yml'
      - 'ETN/**'
      - 'android-etn/**'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-android.yml'
      - 'ETN/**'
      - 'android-etn/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore bundled world data and overlay current source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/etn"
          gh release download v0.6.7 --repo tomas-pak0/etn -p ETN-0.6.7-source.zip -D "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/ETN-0.6.7-source.zip" -d "$RUNNER_TEMP/etn"
          cp -a ETN/. "$RUNNER_TEMP/etn/ETN/"
          cp -a android-etn/. "$RUNNER_TEMP/etn/android-etn/"
          mkdir -p "$RUNNER_TEMP/etn/android-etn/app/src/main/assets"
          cp -a "$RUNNER_TEMP/etn/ETN/." "$RUNNER_TEMP/etn/android-etn/app/src/main/assets/"
      - name: Build
        working-directory: ${{ runner.temp }}/etn/android-etn
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ETN-android-debug
          path: ${{ runner.temp }}/etn/android-etn/app/build/outputs/apk/debug/app-debug.apk

      - name: Split APK for large-artifact transfer
        run: split -b 20m "${{ runner.temp }}/etn/android-etn/app/build/outputs/apk/debug/app-debug.apk" "${{ runner.temp }}/etn-part-"
      - uses: actions/upload-artifact@v4
        with:
          name: ETN-part-aa
          path: ${{ runner.temp }}/etn-part-aa
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ETN-part-ab
          path: ${{ runner.temp }}/etn-part-ab
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ETN-part-ac
          path: ${{ runner.temp }}/etn-part-ac
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ETN-part-ad
          path: ${{ runner.temp }}/etn-part-ad
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ETN-part-ae
          path: ${{ runner.temp }}/etn-part-ae
          compression-level: 0

      - name: Split release Android App Bundle for transfer
        run: split -b 20m "${{ runner.temp }}/etn/android-etn/app/build/outputs/bundle/release/app-release.aab" "${{ runner.temp }}/etn-aab-part-"
      - uses: actions/upload-artifact@v4
        with:
          name: ETN-aab-part-aa
          path: ${{ runner.temp }}/etn-aab-part-aa
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ETN-aab-part-ab
          path: ${{ runner.temp }}/etn-aab-part-ab
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ETN-aab-part-ac
          path: ${{ runner.temp }}/etn-aab-part-ac
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ETN-aab-part-ad
          path: ${{ runner.temp }}/etn-aab-part-ad
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ETN-aab-part-ae
          path: ${{ runner.temp }}/etn-aab-part-ae
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ETN-aab-part-af
          path: ${{ runner.temp }}/etn-aab-part-af
          if-no-files-found: ignore
          compression-level: 0

      - name: Split unsigned release APK for signing
        run: split -b 20m "${{ runner.temp }}/etn/android-etn/app/build/outputs/apk/release/app-release-unsigned.apk" "${{ runner.temp }}/etn-release-apk-part-"
      - uses: actions/upload-artifact@v4
        with:
          name: ETN-release-apk-part-aa
          path: ${{ runner.temp }}/etn-release-apk-part-aa
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ETN-release-apk-part-ab
          path: ${{ runner.temp }}/etn-release-apk-part-ab
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ETN-release-apk-part-ac
          path: ${{ runner.temp }}/etn-release-apk-part-ac
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ETN-release-apk-part-ad
          path: ${{ runner.temp }}/etn-release-apk-part-ad
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ETN-release-apk-part-ae
          path: ${{ runner.temp }}/etn-release-apk-part-ae
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ETN-release-apk-part-af
          path: ${{ runner.temp }}/etn-release-apk-part-af
          if-no-files-found: ignore
          compression-level: 0

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: ETN-android-debug
          path: apk
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p evidence
            adb install apk/app-debug.apk
            adb shell wm size 1080x1920
            adb shell wm density 360
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 1000
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false
            sleep 30
            adb shell am start -n lt.tyliaitpk.etn.next/lt.tyliaitpk.etn.MainActivity
            sleep 12
            adb shell pidof lt.tyliaitpk.etn.next
            adb exec-out screencap -p > evidence/01-home.png
            python3 play-smoke.py
            adb logcat -d -s AndroidRuntime:E | sed '/^---------/d' > evidence/runtime-errors.txt
            test ! -s evidence/runtime-errors.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ETN-smoke-evidence
          path: evidence/
