name: Build and verify ETN Android
on:
  push:
    paths:
      - '.github/workflows/build-android.yml'
      - 'ETN/**'
      - 'android-etn/**'
      - 'play-smoke.py'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify map and movement controls
        run: |
          node tests/map-controls.test.cjs
          node tests/entitlements.test.cjs
          node tests/support.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore complete world data and current source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/etn"
          gh release download v0.6.7 --repo tomas-pak0/etn -p ETN-0.6.7-source.zip -D "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/ETN-0.6.7-source.zip" -d "$RUNNER_TEMP/etn"
          cp -a ETN/. "$RUNNER_TEMP/etn/ETN/"
          cp -a android-etn/. "$RUNNER_TEMP/etn/android-etn/"
          mkdir -p "$RUNNER_TEMP/etn/android-etn/app/src/main/assets"
          cp -a "$RUNNER_TEMP/etn/ETN/." "$RUNNER_TEMP/etn/android-etn/app/src/main/assets/"
      - name: Build APK and AAB
        working-directory: ${{ runner.temp }}/etn/android-etn
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Validate Play bundle
        run: |
          mkdir -p evidence
          curl -fLsS https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle "$RUNNER_TEMP/etn/android-etn/app/build/outputs/bundle/release/app-release.aab" > evidence/bundle-validation.txt
          git rev-parse HEAD > evidence/source-commit.txt
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/etn/android-etn/app/build/outputs/apk/debug/app-debug.apk"
            adb shell wm size 1080x1920
            adb shell wm density 360
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 1000
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false
            sleep 30
            adb shell am start -n lt.tyliaitpk.etn.next/lt.tyliaitpk.etn.MainActivity
            sleep 12
            python3 play-smoke.py
            adb logcat -d -s AndroidRuntime:E | sed '/^---------/d' > evidence/runtime-errors.txt
            test ! -s evidence/runtime-errors.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ETN-Android-verification
          path: evidence/
          retention-days: 7

